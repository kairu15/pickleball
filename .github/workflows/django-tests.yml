name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # CI-only key: settings.py refuses to boot with DEBUG=False without a real key.
  SECRET_KEY: ci-secret-key-not-for-production-0000000000000000
  CI: "true"

jobs:
  test:
    name: Test & migrations
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmysqlclient-dev 2>/dev/null || echo "mysqlclient-dev not available, skipping"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: Fail if model changes have no migration
        run: python manage.py makemigrations --check --dry-run

      - name: Run the full test suite with coverage
        run: |
          pytest \
            --cov=reservations --cov=payments --cov=scoring \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Dependency vulnerability audit
        # Non-blocking for now: report known CVEs without failing the build.
        continue-on-error: true
        run: pip-audit -r requirements.txt

  lint:
    name: Lint & types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # NOTE: these steps are non-blocking while the existing code is brought
      # up to the configured lint/type baseline. Remove `continue-on-error`
      # once `pre-commit run --all-files` is clean locally.
      - name: ruff
        continue-on-error: true
        run: ruff check .

      - name: black --check
        continue-on-error: true
        run: black --check .

      - name: mypy
        continue-on-error: true
        run: mypy . --config-file=pyproject.toml
